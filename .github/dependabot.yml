# What Dependabot watches, and what it must leave alone.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The organization merges only conventional titles: "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
    # The organization's re-pins move the shared reusable workflows; a pull
    # request that bumps them would fight it.
    ignore:
      - dependency-name: Orchestration-Maestro/rust-workflows*
      - dependency-name: Orchestration-Maestro/maestro-rust-workflows*
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # "build(deps): bump ...", a conventional title the organization accepts.
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

# generated by rust-gate sync; do not edit
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # The organization merges only conventional titles: "ci(deps): bump ...".
    commit-message:
      prefix: ci
      include: scope
    # rust-gate sync moves the organization's reusable workflows.
    ignore:
      - dependency-name: Orchestration-Maestro/rust-workflows*
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # "build(deps): bump ...", a conventional title the organization accepts.
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

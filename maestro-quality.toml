# The organization's quality rules as this repository shapes them: the inputs
# its CI caller passes. Read by rust-gate sync.

# The router claims Windows, macOS and Linux, so every pull request tests all
# three; AGENTS.md says why the claim matters here.
[ci]
platforms = "macos windows"

# FO, the output-format switch of Windows' tasklist, which the memory probe
# runs as `tasklist /FI ... /FO CSV /NH`.
[typos]
words = ["FO"]

# ARC-005 finds an item that serves one caller. These stay seams, each for
# the reason it gives.

[[exception]]
rule = "ARC-005"
path = "src/admission/mod.rs"
item = "Decision"
reason = "it is what admission's pure policy returns and the proxy acts on; the proxy's slots are its only library caller, but moving it there would put the policy beside the processes and sockets it is kept apart from, so that its unit tests drive every outcome without them"

[[exception]]
rule = "ARC-005"
path = "src/launch/mod.rs"
item = "models_root"
reason = "where catalog locations resolve is the launcher's to say; bench is its only library caller, but the binary's launch and serve commands and the tests resolve the models root through it too, which the rule does not count"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "arrivals"
reason = "one of the support family's raw HTTP exchanges, beside request and health; only the stream timing tests read arrival times, but it shares their connection and read timeout"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "capped"
reason = "a launcher of the support family, built on the shared private launch code"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "guarded"
reason = "a launcher of the support family, built on the shared private launch code"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "impatient"
reason = "a launcher of the support family, built on the shared private launch code"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "probed"
reason = "a launcher of the support family, built on the shared private launch code"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "reloadable"
reason = "a launcher of the support family, built on the shared private launch code"

[[exception]]
rule = "ARC-005"
path = "tests/it/support/mod.rs"
item = "windowed"
reason = "a launcher of the support family, built on the shared private launch code"

# TST-001 finds a wait on time in a test. This one is an offset rather than a
# wait, for the reason it gives.

[[exception]]
rule = "TST-001"
path = "tests/it/eviction_policy.rs"
item = "a_child_that_becomes_busy_during_a_decision_is_not_taken_from_its_slot"
reason = "the race sweep staggers the reader's start by 0 to 3000 microseconds to exercise interleavings of a stream with an eviction; it is an offset, not a wait, so there is no condition to wait on"

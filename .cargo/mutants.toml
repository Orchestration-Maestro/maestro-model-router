# What `cargo mutants` leaves out when rust-workflows mutates a change.
#
# Each entry is one mutant no test can catch on Linux, where the gate runs,
# and the reason. Remove an entry when its reason stops being true.

exclude_re = [
  # The watch in src/proxy/relay.rs ends on a read error that is not a
  # timeout. Linux reports a reset connection once and end-of-file after
  # it -- the first read fails with ECONNRESET, the second returns 0 -- so
  # a watch that took the error for a pause still ends, one read later.
  # The arm stays for any platform that reports the error again, where
  # taking it for a pause would spin.
  'src/proxy/relay\.rs:\d+:\d+: replace match guard .* with true in watch$',
  # `Served::drop` in src/serving.rs tells the waiting thread that serving
  # ended. `Router::serve` never returns, so the only way it drops is a panic
  # on the serving thread, and no test can make the real router panic there.
  # An empty drop leaves a router whose serving thread panicked waiting for a
  # signal instead of exiting with the panic's status.
  'src/serving\.rs:\d+:\d+: replace <impl Drop for Served>::drop with \(\)$',
  # A second signal in src/serving.rs ends the process while the first
  # signal's stop is still running. That stop sends SIGKILL to each child
  # and then waits for it, and on Linux it returns at once for any child a
  # test can start. So a second signal lands inside the stop only if it wins
  # a race, and a test that depended on that race would be flaky. Without the
  # guard, the second signal starts another stop instead of ending the
  # process.
  'src/serving\.rs:\d+:\d+: replace match guard signalled with false in wait_for_the_end$',
  # The stub reads a request body only when its declared length is above
  # zero. `>=` also runs that read at zero, which reads nothing into an empty
  # buffer, so its behaviour is the same and no test can tell them apart.
  'src/bin/stub_llama_server/reply\.rs:\d+:\d+: replace > with >= in answer$',
  # `output` in src/memory/command.rs polls a hung tool until a monotonic
  # `Instant` deadline. `<` and `<=` differ only when `Instant::now()` equals
  # the deadline to the nanosecond. At that instant `<=` sleeps one more
  # poll and then kills the tool, so the caller still gets `None`. No test
  # can make the clock hit that instant.
  'src/memory/command\.rs:\d+:\d+: replace < with <= in output$',
  # The same instant in `linger` in src/proxy/reply.rs, which drains a
  # refused caller until a monotonic deadline. Anchored to the column of the
  # deadline's `<`, because the bound's `<` on the same line is not
  # equivalent and has a test.
  'src/proxy/reply\.rs:\d+:52: replace < with <= in linger$',
  # How much the relay in src/proxy/relay.rs moves per read. It is not a
  # throughput setting: every read is written and flushed before the next,
  # the body is copied to its declared length whatever the size of each
  # step, and the bytes that arrive are the same bytes in the same order. A
  # buffer of 1032 bytes rather than 8192 changes how many reads that takes
  # and nothing a caller or a child can see.
  'src/proxy/relay\.rs:\d+:\d+: replace \* with \+$',
  # The same for the buffer `linger` in src/proxy/reply.rs drains a refused
  # caller through: it reads to the same bound, deadline or end in smaller
  # steps, and discards what it reads either way.
  'src/proxy/reply\.rs:\d+:\d+: replace \* with \+ in linger$',
  # `scored` in src/bench/rate.rs refuses a rate over zero elapsed seconds,
  # which would be infinite. `>=` differs only when a request over a socket
  # was timed at exactly zero, which no round trip is: the clock measures in
  # nanoseconds on Linux.
  'src/bench/rate\.rs:\d+:\d+: replace > with >= in scored$',
  # `Cause::family` in src/proxy/refusal.rs calls a status below 500 the
  # caller's error. `<=` differs only at 500 itself, and no cause carries
  # 500: `Cause::describe` lists every status there is, and each is a 4xx
  # or one of 501 to 504.
  'src/proxy/refusal\.rs:\d+:\d+: replace < with <= in Cause::family$',
  # `caching_layers` in src/catalog/estimate/cache.rs divides the layers by
  # a full-attention interval above one. `>=` also divides at one, and every
  # count divided by one is itself, which is what the other arm returns.
  'src/catalog/estimate/cache\.rs:\d+:\d+: replace > with >= in caching_layers$',
]

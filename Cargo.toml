# The model router. One crate, one shipped binary, and a library target that
# exists so the tests can link against the catalog types.
#
# One crate, not a workspace: a seam is only real when something varies across
# it, and across all six slices of the design nothing does. Every slice ships
# inside this binary and none introduces a second consumer of any module.
# docs/adr/0001-one-crate-until-a-seam-is-real.md records the decision, the
# condition under which it is reopened, and why the test target firing that
# condition bought a library target rather than a second crate.

[package]
name = "maestro-model-router"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Router that supervises llama.cpp server processes and serves one endpoint per model"
repository = "https://github.com/Orchestration-Maestro/maestro-model-router"
keywords = ["llama-cpp", "llm", "router", "openai", "proxy"]
categories = ["command-line-utilities", "web-programming::http-server"]
# The second binary made `cargo run` ambiguous. This names the shipped one, so
# the commands in README.md work as written.
default-run = "model-router"

# The interface the tests link against. It carries what those tests drive and
# nothing more: the library seam exists for that one consumer, and widening it
# would be a promise no caller has asked for.
[lib]
name = "maestro_model_router"
path = "src/lib.rs"

# The command keeps the name the service unit and every caller already use;
# the package carries the organization's `maestro-` prefix, the binary does not.
[[bin]]
name = "model-router"
path = "src/main.rs"

# The second adapter at the supervision seam: a server that speaks the health
# contract without a model behind it, so continuous integration supervises a
# real process on every platform leg.
#
# Not behind a feature. The fast tier runs `cargo test --all-targets` without
# `--all-features`, so a feature-gated stub would be skipped in continuous
# integration while the run reported green -- the failure
# `tests/it/duplication_allowlist.rs` warns about in its own words. It is built
# by the tests, and it ships in the CI payload beside the router, because
# rust-workflows builds every binary target: harmless, since it serves no model.
[[bin]]
name = "stub-llama-server"
path = "src/bin/stub_llama_server/main.rs"

# A hand-written parser for a format with nested tables and optional fields is
# more code than this one, and wrong in ways that surface at run time.
#
# Reading only: the catalog is never written, so `display` stays off. `serde`
# is on because it gates the `Table` value type, not because anything here
# derives: the catalog is walked by hand so each error can name the entry and
# the field it came from, which a derived deserializer cannot do.
# The request body must be interpreted correctly, and a hand-written scanner
# is the risk rather than the saving: the key that routes is only findable by
# something that tracks strings, escapes and depth, and getting it wrong sends
# the request to the wrong model, which answers plausibly.
[dependencies]
# A child outlives the process that started it unless that process is told it
# is ending, and a signal handler is the only way to be told. Written by hand
# it is a different handler on every platform -- sigaction and a self-pipe on
# Unix, SetConsoleCtrlHandler on Windows -- which is exactly the platform code
# this repository resolves at run time rather than writes. The `termination`
# feature is what makes it a stop rather than an interrupt: SIGTERM and SIGHUP
# beside SIGINT, and Ctrl-Break and a closing console beside Ctrl-C.
ctrlc = { version = "3.5", features = ["termination"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = [
    "parse",
    "serde",
] }

# The organization's lints, LNT-001, sit in the generated block below and deny
# the whole pedantic group, too_many_lines, cognitive_complexity and
# too_many_arguments with it; what this crate adds goes under the end marker.
#
# No `unsafe` in any target, the tests included: the organization's Rust rule,
# which CI also enforces with `-D unsafe_code`. Forbid rather than deny, so no
# `#[allow]` further down can quietly take it back.

# generated by rust-gate lints --write; do not edit down to the end marker
[lints]
clippy.all = { level = "deny", priority = -1 }
clippy.pedantic = { level = "deny", priority = -1 }
clippy.cargo = { level = "deny", priority = -1 }
rust.rust_2018_idioms = { level = "deny", priority = -1 }
clippy.allow_attributes = "deny"
clippy.allow_attributes_without_reason = "deny"
clippy.unwrap_used = "deny"
clippy.expect_used = "deny"
clippy.panic = "deny"
clippy.indexing_slicing = "deny"
clippy.unreachable = "deny"
clippy.exit = "deny"
clippy.todo = "deny"
clippy.unimplemented = "deny"
clippy.dbg_macro = "deny"
clippy.self_named_module_files = "deny"
clippy.absolute_paths = "deny"
clippy.min_ident_chars = "deny"
clippy.redundant_test_prefix = "deny"
clippy.ignore_without_reason = "deny"
clippy.should_panic_without_expect = "deny"
clippy.undocumented_unsafe_blocks = "deny"
clippy.cognitive_complexity = "deny"
clippy.excessive_nesting = "deny"
rust.missing_docs = "deny"
rust.unreachable_pub = "deny"
rust.missing_debug_implementations = "deny"
rust.unused_qualifications = "deny"
rust.let_underscore_drop = "deny"
rust.redundant_lifetimes = "deny"
rust.unit_bindings = "deny"
rust.unexpected_cfgs = "deny"
clippy.multiple_crate_versions = "allow"
clippy.similar_names = "allow"
# end of the generated lints; add the repository's own below, never remove one
rust.unsafe_code = "forbid"

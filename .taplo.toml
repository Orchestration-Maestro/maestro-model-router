# generated by rust-gate sync; do not edit
# taplo: the TOML formatter `just check` and the commit hook run over every
# TOML file in the repository. Arrays keep the shape they were written in, so
# the licence list in deny.toml stays one entry per line. cargo-vet formats its
# own store under supply-chain.
include = ["**/*.toml"]
exclude = [".tools/**", "**/target/**", "**/supply-chain/**"]

[formatting]
array_auto_collapse = false

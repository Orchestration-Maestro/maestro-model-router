# generated by rust-gate sync; do not edit
minimum_prek_version: '0.5.3'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: local
    hooks:
      - id: typos
        name: Spelling in code and prose
        language: mise
        additional_dependencies: ["aqua:crate-ci/typos@1.50.2"]
        entry: typos --force-exclude
      - id: gitleaks
        name: Secrets in the staged change
        language: mise
        additional_dependencies: ["aqua:gitleaks/gitleaks@8.30.1"]
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false
      - id: yamlfmt
        name: YAML formatting
        language: mise
        additional_dependencies: ["aqua:google/yamlfmt@0.21.0"]
        entry: yamlfmt -no_global_conf -lint -formatter indent=2,include_document_start=false,retain_line_breaks_single=true,pad_line_comments=2,line_ending=lf
        types: [yaml]
      - id: taplo
        name: TOML formatting
        language: mise
        additional_dependencies: ["aqua:tamasfe/taplo@0.10.0"]
        entry: taplo fmt --check --diff --no-auto-config --option array_auto_collapse=false
        types: [toml]
        exclude: '(^|/)supply-chain/'
      - id: actionlint
        name: GitHub workflow lint
        language: mise
        additional_dependencies: ["aqua:rhysd/actionlint@1.7.12", "aqua:koalaman/shellcheck@0.11.0"]
        entry: actionlint
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: zizmor
        name: GitHub workflow security audit
        language: mise
        additional_dependencies: ["aqua:zizmorcore/zizmor@1.30.1"]
        entry: zizmor --offline --persona=pedantic --no-progress
        files: '^\.github/(workflows/.*|dependabot|actions/.*/action)\.ya?ml$'
      - id: shellcheck
        name: Shell lint
        language: mise
        additional_dependencies: ["aqua:koalaman/shellcheck@0.11.0"]
        entry: shellcheck
        types: [shell]
      - id: shfmt
        name: Shell formatting
        language: mise
        additional_dependencies: ["aqua:mvdan/sh@3.14.1"]
        entry: shfmt -d
        types: [shell]
      - id: rumdl
        name: Markdown structure
        language: mise
        additional_dependencies: ["aqua:rvben/rumdl@0.2.77"]
        entry: rumdl check --no-cache --no-config --disable MD013,MD041 --config 'MD033.allowed-elements = ["a", "br", "details", "h1", "img", "p", "picture", "source", "strong", "summary"]'
        types: [markdown]
        exclude: '^CHANGELOG\.md$'
      - id: lychee
        name: Markdown links, offline
        language: mise
        additional_dependencies: ["aqua:lycheeverse/lychee@0.24.2"]
        entry: lychee --offline --no-progress
        types: [markdown]
      - id: editorconfig-checker
        name: Every file against .editorconfig
        language: mise
        additional_dependencies: ["github:editorconfig-checker/editorconfig-checker@4.0.2"]
        entry: editorconfig-checker -disable-indent-size
      - id: conventional-commit-header
        name: Commit message opens with a conventional header
        language: pygrep
        entry: '\A(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [a-z][^\n]{0,70}\n'
        args: [--negate, --multiline]
        stages: [commit-msg]
      - id: eighty-columns
        name: Commit message lines stay within 80 columns
        language: pygrep
        entry: '^.{81,}$'
        stages: [commit-msg]
      - id: rustfmt
        name: Rust formatting
        language: system
        entry: cargo fmt --all --check -- --config style_edition=2024
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: Clippy with the organization's lints
        entry: rust-gate clippy --local
        types: [rust]
        stages: [pre-push]
        language: rust
        additional_dependencies:
          - "cli:https://github.com/Orchestration-Maestro/rust-workflows:v3.0.0:rust-gate"
          - "cli:jaq:3.1.1"
        pass_filenames: false
      - id: rust-gate-architecture
        name: Source rules
        entry: rust-gate architecture --local
        files: '(\.rs|Cargo\.toml|Cargo\.lock|maestro-quality\.toml|clippy\.toml)$'
        language: rust
        additional_dependencies:
          - "cli:https://github.com/Orchestration-Maestro/rust-workflows:v3.0.0:rust-gate"
          - "cli:jaq:3.1.1"
        pass_filenames: false
      - id: rust-gate-hygiene
        name: Repository hygiene
        entry: rust-gate hygiene --local
        always_run: true
        language: rust
        additional_dependencies:
          - "cli:https://github.com/Orchestration-Maestro/rust-workflows:v3.0.0:rust-gate"
          - "cli:jaq:3.1.1"
        pass_filenames: false
      - id: rust-gate-rules
        name: Rule map from the golden rules
        entry: rust-gate rules
        always_run: true
        language: rust
        additional_dependencies:
          - "cli:https://github.com/Orchestration-Maestro/rust-workflows:v3.0.0:rust-gate"
          - "cli:jaq:3.1.1"
        pass_filenames: false
      - id: rust-gate-guide
        name: Copilot guide from the tracked files
        entry: rust-gate guide
        always_run: true
        language: rust
        additional_dependencies:
          - "cli:https://github.com/Orchestration-Maestro/rust-workflows:v3.0.0:rust-gate"
          - "cli:jaq:3.1.1"
        pass_filenames: false

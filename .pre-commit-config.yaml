# The commit hooks, hand-maintained here.
#
# Every tool below is pinned once, in mise.toml; `just setup` installs them and
# then installs these hooks. Continuous integration owns formatting, spelling,
# the dependency and source checks and the tests: the hooks are what catches a
# change before it leaves the machine, not a second copy of the gate.

minimum_prek_version: '0.5.4'
default_stages: [pre-commit, pre-merge-commit]
default_install_hook_types: [pre-commit, pre-merge-commit, commit-msg]
repos:
  - repo: builtin
    hooks:
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: local
    hooks:
      - id: workspace-check
        name: Format and check the crate
        language: system
        entry: just pre-commit
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: Secrets in the staged change
        language: system
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        pass_filenames: false
      - id: just-format
        name: Just formatting
        language: system
        entry: just --unstable --fmt --check
        files: '(?i)^\.?justfile$'
        pass_filenames: false
      - id: yamlfmt
        name: YAML formatting
        language: system
        entry: yamlfmt -no_global_conf -lint -formatter indent=2,include_document_start=false,retain_line_breaks_single=true,pad_line_comments=2,line_ending=lf
        types: [yaml]
      - id: taplo
        name: TOML formatting
        language: system
        entry: taplo fmt --check --diff --no-auto-config --option array_auto_collapse=false
        types: [toml]
        exclude: '(^|/)supply-chain/'
      - id: actionlint
        name: GitHub workflow lint
        language: system
        entry: actionlint
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: zizmor
        name: GitHub workflow security audit
        language: system
        entry: zizmor --offline --persona=pedantic --no-progress
        files: '^\.github/(workflows/.*|dependabot|actions/.*/action)\.ya?ml$'
      - id: shellcheck
        name: Shell lint
        language: system
        entry: shellcheck
        types: [shell]
      - id: shfmt
        name: Shell formatting
        language: system
        entry: shfmt -d
        types: [shell]
      - id: rumdl
        name: Markdown structure
        language: system
        entry: rumdl check --no-cache --disable MD013,MD041 --config 'MD033.allowed-elements = ["a", "br", "details", "h1", "img", "p", "picture", "source", "strong", "summary"]'
        types: [markdown]
        exclude: '^CHANGELOG\.md$'
      - id: lychee
        name: Markdown links, offline
        language: system
        entry: lychee --offline --no-progress
        types: [markdown]
      - id: editorconfig-checker
        name: Every file against .editorconfig
        language: system
        entry: editorconfig-checker -disable-indent-size
      - id: conventional-commit-header
        name: Commit message opens with a conventional header
        language: pygrep
        entry: '\A(?=[^\n]{1,71}\n)(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: [a-z][^\n]*\n'
        args: [--negate, --multiline]
        stages: [commit-msg]
      - id: eighty-columns
        name: Commit message lines stay within 80 columns
        language: pygrep
        entry: '^.{81,}$'
        stages: [commit-msg]

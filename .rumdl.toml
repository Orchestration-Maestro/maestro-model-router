# generated by rust-gate sync; do not edit
# rumdl: the Markdown structure every repository holds to. A line wraps where
# its writer wraps it, since a table row or a link cannot; a README opens with
# its banner and draws its badges in HTML; release-please writes the changelog.
[global]
disable = ["MD013", "MD041"]
exclude = ["CHANGELOG.md", "target", ".tools"]

[MD033]
allowed-elements = [
  "a",
  "br",
  "details",
  "h1",
  "img",
  "p",
  "picture",
  "source",
  "strong",
  "summary",
]
